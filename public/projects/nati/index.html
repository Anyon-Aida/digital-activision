<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="/projects/nati/">
  <title>Hey I'm Nati</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#f7f8fb;           /* háttér */
      --card:#ffffff;         /* kártya */
      --ink:#0e1544;          /* sötét felirat */
      --muted:#333a66a6;      /* segédszöveg */
      --btn:#5a35ff;          /* gomb-lila */
      --radius:32px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);font-family:Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink)}
    .page{min-height:100%;display:grid;place-items:center;padding:32px}

    .card{
      width:min(760px,92vw); height:min(92vh,1000px);
      background:var(--card); border-radius:40px; box-shadow:0 30px 80px rgba(0,0,0,.08);
      padding: clamp(24px,5vw,64px);
      position:relative; overflow:hidden;
    }

    /* lekerekített sarok jelzés (bal felső és jobb alsó) */
    .card::before,.card::after{content:""; position:absolute; width:28px;height:28px; border-radius:12px; background:var(--bg)}
    .card::before{left:-14px; top:-14px}
    .card::after{right:-14px; bottom:-14px}

    .hero{display:grid; grid-template-columns:1fr; align-items:center; place-items:center; gap:clamp(12px,4vw,32px); height:100%}
    @media (max-width:820px){ .hero{grid-template-columns:1fr; place-items:center; text-align:center} }

    .bot{ position:relative; width: clamp(240px, 40vw, 420px); aspect-ratio:1 / 1; }
    .bot img{ width:100%; height:100%; object-fit:contain; display:block; filter:drop-shadow(0 26px 40px rgba(66,0,120,.25))}

    h1{ font-size: clamp(38px,6.4vw,64px); line-height:1.05; margin:0 0 12px; font-weight:900 }
    p.lead{ font-size: clamp(18px,3.2vw,28px); color: var(--muted); margin:0 0 clamp(28px,5vw,56px) }

    .cta{
        display:flex;
        align-items:center;
        width: 250px;
        justify-content:center;
        gap:10px;
        background: var(--btn);
        color:#fff;
        font-weight:700;
        letter-spacing:.2px;
        padding:18px 40px;
        border-radius:999px;
        text-decoration:none;
        box-shadow:0 14px 28px rgba(90,53,255,.35);
        margin:0 auto;
    }
    .cta:active{ transform:translateY(1px) }
  </style>
</head>
<body>
  <main class="page">
    <section class="card" aria-label="Intro">
      <div class="hero">
        <div class="bot" aria-hidden="true">
          <img src="./assets/Asset 1.svg" alt="Nati logo"/>
        </div>
        <div class="copy">
          <h1>Hey I'm Nati</h1>
          <p class="lead">Let's chat – I'm here to help!</p>
          <a class="cta" href="#" onclick="goChat(event)">Try now</a>
        </div>
      </div>
    </section>
  </main>
  <script>
    function goChat(e){ e.preventDefault(); window.location.href = './chat/index.html'; }
  </script>
</body>
</html>
